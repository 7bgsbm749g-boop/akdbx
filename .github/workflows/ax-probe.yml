name: AppKit field feasibility
on:
  push:
    branches: [t3/parity-macos-native]
permissions:
  contents: read
jobs:
  appkit:
    runs-on: macos-15
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: AKDBX_TEST_APPKIT=1 python -m pytest -q tests/test_macos_fields.py --tb=short
