name: Card safety

on:
  # The Release workflow reuses this exact suite as a gate.
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  card-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openssl
          command -v google-chrome
          python -m pip install -e '.[test]'
      - name: Test card persistence, authorization and real browser delivery
        env:
          AKDBX_REQUIRE_CARD_CHROMIUM: '1'
          AKDBX_TEST_FOREIGN_UID: '1'
        run: >-
          python -m pytest tests/test_cards.py tests/test_card_validation.py tests/test_card_target.py
          tests/test_card_chromium.py tests/test_card_processor.py tests/test_card_computop.py tests/test_broker.py tests/test_cli.py
          tests/test_writes.py tests/test_web_unlock.py tests/test_totp.py
          tests/test_sso.py tests/test_email_code.py tests/test_notifications.py
          tests/test_notifications_persistent.py
          tests/test_card_notifications.py tests/test_identities.py tests/test_browser_slots.py tests/test_browser_slots_chromium.py
          -q --junitxml=${{ runner.temp }}/card-safety.xml
          --basetemp=${{ runner.temp }}/akdbx-tests
      - name: Require every card safety case to run
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          cases = list(ET.parse(os.path.join(os.environ['RUNNER_TEMP'], 'card-safety.xml')).iter('testcase'))
          assert cases, 'card safety tests did not run'
          skipped = sum(case.find('skipped') is not None for case in cases)
          assert skipped == 0, f'{skipped} card safety cases were skipped'
          print(f'All {len(cases)} card safety cases ran without skips.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-safety-results
          path: |
            ${{ runner.temp }}/card-safety.xml
            ${{ runner.temp }}/akdbx-tests/**/chrome.log
