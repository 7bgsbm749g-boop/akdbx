name: Password field safety
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: password-fields-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-password-fields:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick openssl
          python -m pip install -e '.[test]'
          command -v google-chrome
      - name: Test synthetic password transport and broker boundaries
        run: |
          # The four native KeePassXC merge integration cases run in the local
          # write suite. This browser job does not install the merge engine.
          python -m pytest -q -k 'not test_password_update_survives_merge_with_older_branch' tests/test_browser_password.py tests/test_target_chromium.py \
            tests/test_password_endpoint.py tests/test_broker.py tests/test_cli.py \
            tests/test_target.py tests/test_target_guards.py tests/test_target_writes.py tests/test_writes.py \
            tests/test_import_totp.py tests/test_import_browser.py \
            --basetemp="$RUNNER_TEMP/akdbx-password-tests" \
            --junitxml="$RUNNER_TEMP/akdbx-password.xml"
      - name: Retain synthetic test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-password-fields
          path: |
            ${{ runner.temp }}/akdbx-password.xml
            ${{ runner.temp }}/akdbx-password-tests/**/old-transport-omnibox.png
