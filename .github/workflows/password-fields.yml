name: Password field safety
on:
  # The Release workflow reuses this exact suite as a gate.
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: password-fields-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-password-fields:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick openssl
          python -m pip install -e '.[test]'
          command -v google-chrome
      - name: Test synthetic password transport and broker boundaries
        run: |
          # The four native KeePassXC merge integration cases run in the local
          # write suite. This browser job does not install the merge engine.
          python -m pytest -q -k 'not test_password_update_survives_merge_with_older_branch' tests/test_password_off.py tests/test_password_purpose.py tests/test_password_autocomplete.py tests/test_browser_password.py tests/test_target_chromium.py tests/test_password_frames.py tests/test_password_frames_policy.py tests/test_additional_urls.py tests/test_secret_capture.py tests/test_totp_capture.py tests/test_slot_window_pin.py tests/test_secret_sinks.py \
            tests/test_password_endpoint.py tests/test_broker.py tests/test_cli.py \
            tests/test_target.py tests/test_target_guards.py tests/test_target_writes.py tests/test_writes.py \
            tests/test_import_totp.py tests/test_import_browser.py \
            tests/test_totp.py tests/test_sso.py tests/test_email_code.py \
            tests/test_web_unlock.py tests/test_portal.py tests/test_portal_browser.py tests/test_protocol.py tests/test_notifications.py tests/test_notifications_persistent.py \
            --basetemp="$RUNNER_TEMP/akdbx-password-tests" \
            --junitxml="$RUNNER_TEMP/akdbx-password.xml"
      - name: TOTP delivery through real CDP pins
        run: |
          python -m pytest -q -rs tests/test_totp_browser.py -k cdp \
            --basetemp="$RUNNER_TEMP/akdbx-totp-cdp" --junitxml="$RUNNER_TEMP/akdbx-totp-cdp.xml"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          cases = list(ET.parse(os.path.join(os.environ['RUNNER_TEMP'], 'akdbx-totp-cdp.xml')).iter('testcase'))
          assert cases and not any(c.find('skipped') is not None for c in cases), 'CDP TOTP cases must run without skips'
          PY
      - name: Retain synthetic test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-password-fields
          path: |
            ${{ runner.temp }}/akdbx-password.xml
            ${{ runner.temp }}/akdbx-totp-cdp.xml
            ${{ runner.temp }}/akdbx-password-tests/**/old-transport-omnibox.png
