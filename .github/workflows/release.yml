name: Release

# One release per version for every platform. akdbx is pure Python: the same
# wheel installs on Linux and Windows, and environment markers select
# python-xlib or pywin32. A tag publishes only after the same suites that gate
# pull requests pass on the tagged commit. The release also attaches the
# generic browser extension (one build for every user, fill extension 0.19.0+):
# a Chrome ZIP, an unsigned Firefox ZIP and, when the AMO_JWT_ISSUER and
# AMO_JWT_SECRET secrets are set, the same Firefox build signed by Mozilla.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: version
        name: Tag, package and module versions match
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import os, re, tomllib
          tag = os.environ['TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit(f'release tags must look like v1.2.3, not {tag!r}')
          with open('pyproject.toml', 'rb') as stream:
              package = tomllib.load(stream)['project']['version']
          module = re.search(r'^__version__ = "([^"]+)"', open('src/akdbx/__init__.py', encoding='utf-8').read(), re.M)
          if not module or {package, module.group(1)} != {tag[1:]}:
              raise SystemExit(f'tag {tag} does not match pyproject {package} and __version__ {module and module.group(1)}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={package}\n')
          EOF
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  tests:
    needs: verify
    uses: ./.github/workflows/tests.yml
  card-safety:
    needs: verify
    uses: ./.github/workflows/card-safety.yml
  password-fields:
    needs: verify
    uses: ./.github/workflows/password-fields.yml
  private-import:
    needs: verify
    uses: ./.github/workflows/private-import.yml

  build:
    name: Build sdist and wheel
    needs: [verify, tests, card-safety, password-fields, private-import]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build==1.2.2
      - run: python -m build
      - name: Exactly one universal wheel and one sdist
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ls dist
          test "$(ls dist | wc -l)" -eq 2
          test -f "dist/akdbx-${VERSION}-py3-none-any.whl"
          test -f "dist/akdbx-${VERSION}.tar.gz"
      - name: Checksums
        working-directory: dist
        run: sha256sum akdbx-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  install:
    name: Install wheel (${{ matrix.os }})
    needs: [verify, build]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the released wheel into a clean environment
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python -m venv clean
          if [ -x clean/bin/python ]; then py=clean/bin/python; else py=clean/Scripts/python; fi
          "$py" -m pip install "dist/akdbx-${VERSION}-py3-none-any.whl"
          # Windows prints CRLF; command substitution strips only the LF.
          installed=$("$py" -m akdbx.cli --version | tr -d '\r')
          test "$installed" = "$VERSION"
          # The platform dependency comes from the same wheel's markers.
          if [ "$RUNNER_OS" = Windows ]; then
            "$py" -c "import win32api, akdbx.windows_rpc"
          elif [ "$RUNNER_OS" = macOS ]; then
            "$py" -c "import akdbx.macos, akdbx.cli"
          else
            "$py" -c "import Xlib, akdbx.target"
          fi

  extension:
    name: Generic extension archives and Mozilla's signature
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the extension from the released wheel
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python -m venv clean
          clean/bin/python -m pip install "dist/akdbx-${VERSION}-py3-none-any.whl"
          mkdir ext
          for browser in chrome firefox; do
            name=$(clean/bin/python -c 'import sys; from akdbx.extension_host import archive_name; print(archive_name(sys.argv[1]))' "$browser")
            clean/bin/python -m akdbx.cli extension pack --browser "$browser" --output "ext/$name"
          done
          ls -l ext
      # The upload is the unsigned Firefox ZIP above, byte for byte, at the build's own version. A re-run
      # of this tag finds that version on AMO and resumes it (review, then download); nothing is uploaded twice.
      - name: Mozilla signs the Firefox build (AMO, unlisted)
        id: sign
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set +e
          clean/bin/python -m akdbx.firefox_signing --output ext --timeout 1200 > "$RUNNER_TEMP/sign.json"
          status=$?
          set -e
          cat "$RUNNER_TEMP/sign.json"
          if [ "$status" -eq 0 ]; then
            echo signed=true >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 3 ]; then
            echo signed=false >> "$GITHUB_OUTPUT"
            echo "::warning::AMO_JWT_ISSUER and AMO_JWT_SECRET are not set: this release has no signed Firefox add-on"
          else
            echo "::error::Mozilla did not sign the Firefox build; nothing is published. Re-run the failed jobs to resume."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: ext/
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [verify, build, install, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: ext
      - name: Add the extension archives and their checksums
        env:
          SIGNED: ${{ needs.extension.outputs.signed }}
        run: |
          set -- ext/akdbx-extension-chrome-*.zip; test "$#" -eq 1 && test -f "$1"
          set -- ext/akdbx-extension-firefox-*.zip; test "$#" -eq 1 && test -f "$1"
          if [ "$SIGNED" = true ]; then set -- ext/akdbx-extension-firefox-*.xpi; test "$#" -eq 1 && test -f "$1"; fi
          mv ext/akdbx-extension-* dist/
          cd dist
          sha256sum akdbx-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/akdbx-*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          SIGNED: ${{ needs.extension.outputs.signed }}
        run: |
          sed "s/{{VERSION}}/${VERSION}/g" .github/release-notes.md > notes.md
          if [ "$SIGNED" != true ]; then
            printf '\n**This release has no Mozilla-signed Firefox add-on** (the AMO API key was not set). Load the unsigned Firefox ZIP as a temporary add-on (docs/firefox.md), or use the signed XPI of an earlier release with the same extension version.\n' >> notes.md
          fi
          gh release create "$TAG" dist/akdbx-* dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "akdbx $VERSION" --notes-file notes.md --generate-notes
