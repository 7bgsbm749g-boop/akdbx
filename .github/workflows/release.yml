name: Release

# One release per version for every platform. akdbx is pure Python: the same
# wheel installs on Linux and Windows, and environment markers select
# python-xlib or pywin32. A tag publishes only after the same suites that gate
# pull requests pass on the tagged commit.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: version
        name: Tag, package and module versions match
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import os, re, tomllib
          tag = os.environ['TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit(f'release tags must look like v1.2.3, not {tag!r}')
          with open('pyproject.toml', 'rb') as stream:
              package = tomllib.load(stream)['project']['version']
          module = re.search(r'^__version__ = "([^"]+)"', open('src/akdbx/__init__.py', encoding='utf-8').read(), re.M)
          if not module or {package, module.group(1)} != {tag[1:]}:
              raise SystemExit(f'tag {tag} does not match pyproject {package} and __version__ {module and module.group(1)}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={package}\n')
          EOF
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  tests:
    needs: verify
    uses: ./.github/workflows/tests.yml
  card-safety:
    needs: verify
    uses: ./.github/workflows/card-safety.yml
  password-fields:
    needs: verify
    uses: ./.github/workflows/password-fields.yml
  private-import:
    needs: verify
    uses: ./.github/workflows/private-import.yml
  safari:
    needs: verify
    uses: ./.github/workflows/safari-native.yml

  build:
    name: Build sdist and wheel
    needs: [verify, tests, card-safety, password-fields, private-import, safari]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build==1.2.2
      - run: python -m build
      - name: Exactly one universal wheel and one sdist
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ls dist
          test "$(ls dist | wc -l)" -eq 2
          test -f "dist/akdbx-${VERSION}-py3-none-any.whl"
          test -f "dist/akdbx-${VERSION}.tar.gz"
      - name: Checksums
        working-directory: dist
        run: sha256sum akdbx-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  install:
    name: Install wheel (${{ matrix.os }})
    needs: [verify, build]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the released wheel into a clean environment
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python -m venv clean
          if [ -x clean/bin/python ]; then py=clean/bin/python; else py=clean/Scripts/python; fi
          "$py" -m pip install "dist/akdbx-${VERSION}-py3-none-any.whl"
          # Windows prints CRLF; command substitution strips only the LF.
          installed=$("$py" -m akdbx.cli --version | tr -d '\r')
          test "$installed" = "$VERSION"
          # The platform dependency comes from the same wheel's markers.
          if [ "$RUNNER_OS" = Windows ]; then
            "$py" -c "import win32api, akdbx.windows_rpc"
          elif [ "$RUNNER_OS" = macOS ]; then
            "$py" -c "import akdbx.macos, akdbx.cli"
          else
            "$py" -c "import Xlib, akdbx.target"
          fi

  publish:
    name: Publish GitHub release
    needs: [verify, build, install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/akdbx-*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          sed "s/{{VERSION}}/${VERSION}/g" .github/release-notes.md > notes.md
          gh release create "$TAG" dist/akdbx-* dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "akdbx $VERSION" --notes-file notes.md --generate-notes
