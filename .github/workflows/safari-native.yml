name: Safari native

on:
  workflow_call:
  push:
    branches: [t3/safari-extension-20261125]
  pull_request:

permissions:
  contents: read

jobs:
  safari-native:
    name: Native Safari bridge and developer app
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Compile, sandbox, exchange native frames, and package the app
        env:
          AKDBX_REQUIRE_SAFARI_NATIVE: '1'
        run: >-
          python -m pytest -q -rs tests/test_safari_native.py
          --basetemp="${{ runner.temp }}/s"
          --junitxml="${{ runner.temp }}/safari-native.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-native-results
          path: ${{ runner.temp }}/safari-native.xml
