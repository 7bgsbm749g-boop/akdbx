name: Safari native

on:
  workflow_call:
  push:
    branches: [t3/safari-extension-20261125]
  pull_request:

permissions:
  contents: read

jobs:
  safari-browser:
    name: Actual Safari native extension (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26-arm64]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' selenium==4.38.0
      - name: Enable the disposable runner's Safari automation
        run: sudo /usr/bin/safaridriver --enable
      - name: Load the actual native extension in Safari
        env:
          AKDBX_REQUIRE_SAFARI_NATIVE: '1'
          AKDBX_REQUIRE_SAFARI_BROWSER: '1'
        run: >-
          python -m pytest -q -rs tests/test_safari_browser.py
          --basetemp="${{ runner.temp }}/sb"
          --junitxml="${{ runner.temp }}/safari-browser.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-browser-results-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/safari-browser.xml
            ${{ runner.temp }}/sb/**/safaridriver.log
            ${{ runner.temp }}/sb/**/actual-safari-native.png
            ${{ runner.temp }}/sb/**/safari-startup.png
            ${{ runner.temp }}/sb/**/safari-startup.json
            ${{ runner.temp }}/sb/**/safari-diagnostics/*
  safari-native:
    name: Native Safari bridge and developer app
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Compile, sandbox, exchange native frames, and package the app
        env:
          AKDBX_REQUIRE_SAFARI_NATIVE: '1'
        run: >-
          python -m pytest -q -rs tests/test_safari_native.py
          --basetemp="${{ runner.temp }}/s"
          --junitxml="${{ runner.temp }}/safari-native.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-native-results
          path: ${{ runner.temp }}/safari-native.xml
