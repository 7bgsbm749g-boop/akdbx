name: Tests

on:
  # The Release workflow reuses this exact suite as a gate.
  workflow_call:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  firefox-extension-browser:
    name: Firefox ${{ matrix.firefox }} extension (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
        firefox: ['161.0']
        include:
          - os: ubuntu-24.04
            firefox: '153.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' selenium==4.38.0
      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        id: firefox
        with:
          firefox-version: ${{ matrix.firefox }}
      - name: Install pinned geckodriver from Mozilla
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, io, os, platform, tarfile, urllib.request, zipfile
          from pathlib import Path
          suffix = ('win64.zip' if os.name == 'nt' else
                    ('macos-aarch64.tar.gz' if platform.machine() == 'arm64' else 'macos.tar.gz')
                    if platform.system() == 'Darwin' else 'linux64.tar.gz')
          checksums = {
              'linux64.tar.gz': '0bde38707eb0a686a20c6bd50f4adcc7d60d4f73c60eb83ee9e0db8f65823e04',
              'macos-aarch64.tar.gz': 'c045c8c0d859e6045defbb1c31b37ebeb3c942fc61daaf11e21fc634f2d71c52',
              'macos.tar.gz': 'b5627bfc29801b8752c9f1e7699018963c39c076aab6576dc14fcb1ce7a256f6',
              'win64.zip': '4c23d54681d431b42575a66c3c89202a40add3ef45e64b94acac620a89774ad2',
          }
          url = 'https://github.com/mozilla/geckodriver/releases/download/v0.36.0/geckodriver-v0.36.0-' + suffix
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read(16 * 1024 * 1024)
          assert hashlib.sha256(data).hexdigest() == checksums[suffix], 'geckodriver checksum mismatch'
          name = 'geckodriver.exe' if os.name == 'nt' else 'geckodriver'
          archive = zipfile.ZipFile(io.BytesIO(data)) if suffix.endswith('.zip') else tarfile.open(fileobj=io.BytesIO(data))
          with archive:
              member = archive.open(name) if suffix.endswith('.zip') else archive.extractfile(name)
              with member:
                  binary = member.read(16 * 1024 * 1024 + 1)
          assert len(binary) <= 16 * 1024 * 1024, 'geckodriver exceeds size limit'
          folder = Path(os.environ['RUNNER_TEMP']) / 'geckodriver'
          folder.mkdir()
          path = folder / name
          path.write_bytes(binary)
          path.chmod(0o755)
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as stream:
              print(folder, file=stream)
          PY
      - name: Private QR import from the Firefox toolbar
        if: runner.os == 'Linux'
        env:
          AKDBX_TEST_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb xdotool
          python -m pytest -q tests/test_import_extension_linux.py -k firefox --basetemp="$RUNNER_TEMP/if"
      - name: Firefox host, exact documents, iframe fills and navigation refusal
        shell: bash
        env:
          AKDBX_REQUIRE_FIREFOX_BROWSER: '1'
          AKDBX_TEST_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
        run: |
          firefox_test_base="$RUNNER_TEMP/f"
          if [ "$RUNNER_OS" = Windows ]; then firefox_test_base="$LOCALAPPDATA/akdbx-firefox-tests"; fi
          python -m pytest -q -rs tests/test_firefox_browser.py tests/test_firefox_extension.py \
            --basetemp="$firefox_test_base" --junitxml="$RUNNER_TEMP/firefox.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firefox-results-${{ matrix.os }}-${{ matrix.firefox }}
          path: ${{ runner.temp }}/firefox.xml
  macos-broker:
    name: Native macOS broker
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Install and remove per-user browser hosts
        run: python -m pytest -q tests/test_extension_host_install.py
      - name: Darwin IPC, TLS, encrypted persistence, and extension contract
        run: >-
          python -m pytest -q -rs tests/test_macos_native.py tests/test_protocol.py
          tests/test_local_https.py tests/test_extension_route.py
          --basetemp="${{ runner.temp }}/m"
      - name: macOS setup, LaunchAgent, lock notifications and private page transports
        env:
          AKDBX_MACOS_RUNNER: '1'
        run: |
          umask 077
          python -m pytest -q -rs tests/test_macos_platform.py \
            tests/test_relay.py::test_serve_uses_the_saved_relay_and_unlocks_from_a_phone \
            tests/test_notifications.py::test_real_private_unlock_triggers_event_without_agent_wait \
            tests/test_notifications.py::test_verified_https_delivery_and_redirect_refusal \
            tests/test_sms.py::test_https_intake_from_a_shortcut_and_twilio \
            tests/test_sms.py::test_https_intake_refuses_wrong_token_host_origin_method_and_body \
            tests/test_web_unlock.py::test_tailscale_identity_and_one_time_web_unlock \
            tests/test_import_totp.py::test_host_install_is_explicit_and_refuses_overwrite \
            tests/test_import_totp.py::test_host_install_records_invoked_script_without_path_lookup \
            tests/test_import_totp.py::test_host_install_registration_is_private_under_shared_umask \
            tests/test_import_totp.py::test_host_install_refuses_replaceable_manifest_directory \
            tests/test_import_totp.py::test_macos_launcher_is_shared_only_when_identical \
            tests/test_import_totp.py::test_native_host_subprocess_to_private_broker \
            --basetemp="$RUNNER_TEMP/p" --junitxml="$RUNNER_TEMP/platform.xml"
          python -c 'import sys, xml.etree.ElementTree as E; sys.exit(bool(E.parse(sys.argv[1]).findall(".//skipped")))' "$RUNNER_TEMP/platform.xml"
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - name: Install and remove per-user browser hosts
        run: python -m pytest -q tests/test_extension_host_install.py
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: python -m pytest -q tests/test_vault_lock.py tests/test_protocol.py tests/test_cli.py tests/test_broker.py tests/test_writes.py tests/test_web_unlock.py tests/test_totp.py tests/test_target.py tests/test_target_guards.py tests/test_password_frames_policy.py tests/test_additional_urls.py tests/test_save_secret.py tests/test_secret_sinks.py tests/test_generated_native_clock.py tests/test_windows_target.py tests/test_windows_unlock.py tests/test_local_https.py tests/test_windows_native.py tests/test_extension_route.py tests/test_relay.py tests/test_relay_integration.py tests/test_setup.py tests/test_page_url_file.py tests/test_broker_identity.py tests/test_browser_slots.py tests/test_extension_launcher.py tests/test_pairing_notifications.py tests/test_android_route.py tests/test_android_lifecycle.py tests/test_entry_organize.py tests/test_entry_edit.py --basetemp="${{ runner.temp }}/akdbx-tests"
      - run: node --test tests/test_fill_extension.js
      # The bundled Android helper dex must be the build of its Java source.
      - name: Android helper build is reproducible
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-35" > /dev/null
          JAVA_HOME="$JAVA_HOME_17_X64" ANDROID_SDK="$ANDROID_SDK_ROOT" python -m pytest -q -rs tests/test_android_route.py -k "helper" --basetemp="${{ runner.temp }}/akdbx-android"
  linux-native-fields:
    name: Native Linux controls (X11 and Wayland)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pip install 'PyQt6==6.8.1' 'PyQt6-Qt6==6.8.2'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb openbox weston xwayland at-spi2-core dbus-x11 libgtk-3-0t64 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxkbcommon-x11-0
      - name: Native delivery and encrypted saves on both Linux display systems
        env:
          AKDBX_TEST_NATIVE_LINUX: '1'
        run: dbus-run-session -- python -m pytest -q -rs tests/test_linux_fields.py tests/test_native_fields.py --basetemp="${{ runner.temp }}/native-fields"
  native-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Compatibility cases run historical broker code.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Merge encrypted vaults without an external engine
        run: >-
          python -m pytest -q tests/test_merge.py tests/test_native_merge_edges.py tests/test_refresh_merge.py tests/test_selection.py
          tests/test_versions.py tests/test_signature_resources.py
          --basetemp="${{ runner.temp }}/native-merge"
  linux-extension-browser:
    # The extension route in a real browser: secret capture and frame owners.
    # Google Chrome 137+ ignores --load-extension; Chrome
    # for Testing still loads the unpacked test extension.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Install pinned Chrome for Testing
        run: |
          curl --fail --location --max-time 300 --max-filesize 268435456 --output "$RUNNER_TEMP/chrome-linux64.zip" \
            https://storage.googleapis.com/chrome-for-testing-public/153.0.8010.12/linux64/chrome-linux64.zip
          echo "8aac35011c18f6e2d10696154af89a5728ac2ddd6dc6fad24ffdf243c3fcfd5a  $RUNNER_TEMP/chrome-linux64.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/chrome-linux64.zip" -d "$RUNNER_TEMP/cft"
      - name: Extension route in Chrome for Testing
        env:
          AKDBX_REQUIRE_EXTENSION_BROWSER: '1'
          AKDBX_TEST_EXTENSION_BROWSER: ${{ runner.temp }}/cft/chrome-linux64/chrome
          # A disposable synthetic profile only; the runner may not allow Chromium's user-namespace sandbox.
          AKDBX_TEST_BROWSER_NO_SANDBOX: '1'
        run: python -m pytest -q -rs tests/test_extension_browser.py --basetemp="${{ runner.temp }}/akdbx-tests" --junitxml="${{ runner.temp }}/extension-browser.xml"
      - name: Private QR import from the toolbar in Chrome for Testing
        env:
          AKDBX_TEST_EXTENSION_BROWSER: ${{ runner.temp }}/cft/chrome-linux64/chrome
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb xdotool
          python -m pytest -q tests/test_import_extension_linux.py -k chrome --basetemp="$RUNNER_TEMP/ic"
      - name: TOTP delivery through real extension pins
        env:
          AKDBX_REQUIRE_EXTENSION_BROWSER: '1'
          AKDBX_TEST_EXTENSION_BROWSER: ${{ runner.temp }}/cft/chrome-linux64/chrome
          AKDBX_TEST_BROWSER_NO_SANDBOX: '1'
        run: python -m pytest -q -rs tests/test_totp_browser.py -k extension --basetemp="${{ runner.temp }}/akdbx-totp-extension" --junitxml="${{ runner.temp }}/extension-totp.xml"
      - name: Cover checks as a wide-gamut display renders them
        env:
          AKDBX_REQUIRE_EXTENSION_BROWSER: '1'
          AKDBX_TEST_EXTENSION_BROWSER: ${{ runner.temp }}/cft/chrome-linux64/chrome
          AKDBX_TEST_BROWSER_NO_SANDBOX: '1'
          # The pixel challenge compares exact colours; tab screenshots must stay sRGB on a colour-managed display.
          AKDBX_TEST_BROWSER_EXTRA_ARGS: '--force-color-profile=display-p3-d65'
        run: python -m pytest -q -rs tests/test_extension_browser.py -k "cover or reads or fills or wrapped" --basetemp="${{ runner.temp }}/akdbx-tests-p3"
      - name: Require every extension browser case to run
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          cases = list(ET.parse(os.path.join(os.environ['RUNNER_TEMP'], 'extension-browser.xml')).iter('testcase'))
          skipped = sum(case.find('skipped') is not None for case in cases)
          assert len(cases) >= 20 and skipped == 0, f'{len(cases)} cases, {skipped} skipped'
          print(f'All {len(cases)} extension browser cases ran without skips.')
          totp = list(ET.parse(os.path.join(os.environ['RUNNER_TEMP'], 'extension-totp.xml')).iter('testcase'))
          assert totp and not any(c.find('skipped') is not None for c in totp), 'Extension TOTP cases must run without skips'
          PY
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - name: Install and remove per-user browser hosts
        run: python -m pytest -q tests/test_extension_host_install.py
      - run: python -m akdbx.cli --version
      - name: Win32, WinForms and WPF native fields
        run: python -m pytest -q -rs tests/test_windows_fields.py --basetemp="$env:LOCALAPPDATA/akdbx-field-tests" --junitxml="$env:RUNNER_TEMP/akdbx-windows-fields.xml"
      - name: Native pipe, saves, DOM and extension routes in real Chromium, merge and admission
        env:
          AKDBX_REQUIRE_WINDOWS_CHROMIUM: '1'
          AKDBX_TEST_BROWSER: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          # Google Chrome 137+ ignores --load-extension; Edge still loads the
          # unpacked test extension into its disposable profile.
          AKDBX_REQUIRE_EXTENSION_BROWSER: '1'
          AKDBX_TEST_EXTENSION_BROWSER: 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
        run: python -m pytest -q -rs tests/test_vault_lock.py::test_windows_receives_session_and_power_messages tests/test_protocol.py tests/test_windows_target.py tests/test_native_fields.py tests/test_windows_unlock.py tests/test_windows_native.py tests/test_windows_sinks.py tests/test_windows_browser.py tests/test_windows_chromium.py tests/test_windows_merge.py tests/test_extension_route.py tests/test_extension_browser.py --basetemp="$env:LOCALAPPDATA/akdbx-tests" --junitxml="$env:RUNNER_TEMP/akdbx-windows.xml"
      - name: Windows TOTP delivery through Chrome CDP and Edge extension pins
        env:
          AKDBX_REQUIRE_EXTENSION_BROWSER: '1'
          AKDBX_TEST_EXTENSION_BROWSER: 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          AKDBX_TEST_BROWSER: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
        run: python -m pytest -q -rs tests/test_totp_browser.py --basetemp="$env:LOCALAPPDATA/akdbx-totp-extension" --junitxml="$env:RUNNER_TEMP/extension-totp.xml"
      - name: Windows Edge CDP, processor frames and SMS delivery
        env:
          AKDBX_TEST_BROWSER: 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
        run: >-
          python -m pytest -q -rs
          tests/test_windows_chromium.py::test_saved_values_reach_only_the_pinned_fields_without_keys_or_tab
          tests/test_card_processor.py::test_attested_oopif_fills_retained_field_without_secret_receipts
          tests/test_card_processor.py::test_stripe_fills_three_exact_fields_and_handles_spaced_expiry
          tests/test_card_computop.py::test_computop_fills_only_the_attested_field
          tests/test_sms_chromium.py::test_code_fills_only_the_pinned_focused_input_and_returns_no_code
          --basetemp="$env:LOCALAPPDATA/akdbx-edge" --junitxml="$env:RUNNER_TEMP/edge-cdp.xml"
      - name: Require every Windows case to run
        shell: pwsh
        run: |
          [xml]$report = Get-Content (Join-Path $env:RUNNER_TEMP 'akdbx-windows.xml')
          $suite = $report.testsuites.testsuite
          if ([int]$suite.tests -lt 200) { throw "only $($suite.tests) Windows cases ran" }
          if ([int]$suite.skipped -ne 0) { throw "$($suite.skipped) Windows cases were skipped" }
          "All $($suite.tests) Windows cases ran without skips."
          [xml]$fields = Get-Content (Join-Path $env:RUNNER_TEMP 'akdbx-windows-fields.xml')
          if ([int]$fields.testsuites.testsuite.skipped -ne 0) { throw 'Windows native fields must run without skips' }
          [xml]$totpReport = Get-Content (Join-Path $env:RUNNER_TEMP 'extension-totp.xml')
          $totp = $totpReport.testsuites.testsuite
          foreach ($route in @('cdp', 'extension')) {
            if (-not ($totp.testcase | Where-Object { $_.name -match "\[$route(\]|-)" })) { throw "Missing $route TOTP tests" }
          }
          if ([int]$totp.skipped -ne 0) { throw 'TOTP tests must run without skips' }
          [xml]$edge = Get-Content (Join-Path $env:RUNNER_TEMP 'edge-cdp.xml')
          if ([int]$edge.testsuites.testsuite.skipped -ne 0) { throw 'Edge CDP cases must run without skips' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-results
          path: |
            ${{ runner.temp }}/akdbx-windows-fields.xml
            ${{ runner.temp }}/akdbx-windows.xml
            ${{ runner.temp }}/extension-totp.xml
            ${{ runner.temp }}/edge-cdp.xml
