name: Tests

on:
  # The Release workflow reuses this exact suite as a gate.
  workflow_call:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  macos-broker:
    name: Native macOS broker
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Darwin IPC, TLS, encrypted persistence, and extension contract
        run: >-
          python -m pytest -q -rs tests/test_macos_native.py tests/test_protocol.py
          tests/test_local_https.py tests/test_extension_route.py
          --basetemp="${{ runner.temp }}/m"
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      # Native merge/benchmark tests need the separately provisioned, pinned
      # KeePassXC engine. This job covers shared core and both delivery contracts.
      - run: python -m pytest -q tests/test_vault_lock.py tests/test_protocol.py tests/test_cli.py tests/test_broker.py tests/test_writes.py tests/test_web_unlock.py tests/test_totp.py tests/test_target.py tests/test_target_guards.py tests/test_password_frames_policy.py tests/test_additional_urls.py tests/test_save_secret.py tests/test_secret_sinks.py tests/test_generated_native_clock.py tests/test_windows_target.py tests/test_windows_unlock.py tests/test_local_https.py tests/test_windows_native.py tests/test_extension_route.py tests/test_relay.py tests/test_relay_integration.py tests/test_setup.py tests/test_page_url_file.py tests/test_broker_identity.py tests/test_browser_slots.py tests/test_extension_launcher.py tests/test_pairing_notifications.py tests/test_android_route.py tests/test_android_lifecycle.py tests/test_entry_organize.py tests/test_entry_edit.py --basetemp="${{ runner.temp }}/akdbx-tests"
      - run: node --test tests/test_fill_extension.js
      # The bundled Android helper dex must be the build of its Java source.
      - name: Android helper build is reproducible
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-35" > /dev/null
          JAVA_HOME="$JAVA_HOME_17_X64" ANDROID_SDK="$ANDROID_SDK_ROOT" python -m pytest -q -rs tests/test_android_route.py -k "helper" --basetemp="${{ runner.temp }}/akdbx-android"
  linux-native-fields:
    name: Native Linux controls (X11 and Wayland)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pip install 'PyQt6==6.8.1' 'PyQt6-Qt6==6.8.2'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb openbox weston at-spi2-core dbus-x11 libgtk-3-0t64 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxkbcommon-x11-0
      - name: Native delivery and encrypted saves on both Linux display systems
        env:
          AKDBX_TEST_NATIVE_LINUX: '1'
        run: dbus-run-session -- python -m pytest -q -rs tests/test_linux_fields.py tests/test_native_fields.py --basetemp="${{ runner.temp }}/native-fields"
  linux-extension-browser:
    # The extension route in a real browser: secret capture and frame owners.
    # Google Chrome 137+ ignores --load-extension; Chrome
    # for Testing still loads the unpacked test extension.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Install pinned Chrome for Testing
        run: |
          curl --fail --location --max-time 300 --max-filesize 268435456 --output "$RUNNER_TEMP/chrome-linux64.zip" \
            https://storage.googleapis.com/chrome-for-testing-public/153.0.8010.12/linux64/chrome-linux64.zip
          echo "8aac35011c18f6e2d10696154af89a5728ac2ddd6dc6fad24ffdf243c3fcfd5a  $RUNNER_TEMP/chrome-linux64.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/chrome-linux64.zip" -d "$RUNNER_TEMP/cft"
      - name: Extension route in Chrome for Testing
        env:
          AKDBX_REQUIRE_EXTENSION_BROWSER: '1'
          AKDBX_TEST_EXTENSION_BROWSER: ${{ runner.temp }}/cft/chrome-linux64/chrome
          # A disposable synthetic profile only; the runner may not allow Chromium's user-namespace sandbox.
          AKDBX_TEST_BROWSER_NO_SANDBOX: '1'
        run: python -m pytest -q -rs tests/test_extension_browser.py --basetemp="${{ runner.temp }}/akdbx-tests" --junitxml="${{ runner.temp }}/extension-browser.xml"
      - name: Cover checks as a wide-gamut display renders them
        env:
          AKDBX_REQUIRE_EXTENSION_BROWSER: '1'
          AKDBX_TEST_EXTENSION_BROWSER: ${{ runner.temp }}/cft/chrome-linux64/chrome
          AKDBX_TEST_BROWSER_NO_SANDBOX: '1'
          # The pixel challenge compares exact colours; tab screenshots must stay sRGB on a colour-managed display.
          AKDBX_TEST_BROWSER_EXTRA_ARGS: '--force-color-profile=display-p3-d65'
        run: python -m pytest -q -rs tests/test_extension_browser.py -k "cover or reads or fills or wrapped" --basetemp="${{ runner.temp }}/akdbx-tests-p3"
      - name: Require every extension browser case to run
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          cases = list(ET.parse(os.path.join(os.environ['RUNNER_TEMP'], 'extension-browser.xml')).iter('testcase'))
          skipped = sum(case.find('skipped') is not None for case in cases)
          assert len(cases) >= 20 and skipped == 0, f'{len(cases)} cases, {skipped} skipped'
          print(f'All {len(cases)} extension browser cases ran without skips.')
          PY
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m akdbx.cli --version
      - name: Install the pinned native merge engine for all users
        shell: pwsh
        run: |
          # The broker runs only a machine-installed, system-owned engine. The
          # runner is elevated, so this is the same location a user install has.
          $zip = Join-Path $env:RUNNER_TEMP 'KeePassXC.zip'
          curl.exe --fail --location --max-time 180 --max-filesize 67108864 --output $zip `
            https://github.com/keepassxreboot/keepassxc/releases/download/2.7.10/KeePassXC-2.7.10-Win64.zip
          $expected = '1769e49bec7a5681e047808876623d525a3741b58959c253e5963476d4cba217'
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'KeePassXC archive checksum mismatch' }
          $unpacked = Join-Path $env:RUNNER_TEMP 'keepassxc'
          Expand-Archive -Path $zip -DestinationPath $unpacked
          $target = Join-Path $env:ProgramFiles 'KeePassXC'
          if (Test-Path $target) { throw 'KeePassXC is already installed on this runner' }
          Move-Item (Join-Path $unpacked 'KeePassXC-2.7.10-Win64') $target
          # Files moved from the runner's temp folder keep its permissions:
          # take the Program Files defaults instead, owned by Administrators.
          icacls $target /setowner '*S-1-5-32-544' /T /C /Q | Out-Null
          icacls $target /reset /T /C /Q | Out-Null
          $version = & (Join-Path $target 'keepassxc-cli.exe') --version
          if ($version -ne '2.7.10') { throw "unexpected engine version $version" }
          python -c "from akdbx import windows_merge; assert windows_merge.engine_version() == '2.7.10', 'the installed engine did not pass the production trust check'"
      - name: Native pipe, saves, DOM and extension routes in real Chromium, merge and admission
        env:
          AKDBX_REQUIRE_WINDOWS_CHROMIUM: '1'
          AKDBX_REQUIRE_WINDOWS_ENGINE: '1'
          # Google Chrome 137+ ignores --load-extension; Edge still loads the
          # unpacked test extension into its disposable profile.
          AKDBX_REQUIRE_EXTENSION_BROWSER: '1'
          AKDBX_TEST_EXTENSION_BROWSER: 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
        run: python -m pytest -q -rs tests/test_vault_lock.py::test_windows_receives_session_and_power_messages tests/test_protocol.py tests/test_windows_target.py tests/test_windows_fields.py tests/test_native_fields.py tests/test_windows_unlock.py tests/test_windows_native.py tests/test_windows_browser.py tests/test_windows_chromium.py tests/test_windows_merge.py tests/test_extension_route.py tests/test_extension_browser.py --basetemp="$env:LOCALAPPDATA/akdbx-tests" --junitxml="$env:RUNNER_TEMP/akdbx-windows.xml"
      - name: Require every Windows case to run
        shell: pwsh
        run: |
          [xml]$report = Get-Content (Join-Path $env:RUNNER_TEMP 'akdbx-windows.xml')
          $suite = $report.testsuites.testsuite
          if ([int]$suite.tests -lt 200) { throw "only $($suite.tests) Windows cases ran" }
          if ([int]$suite.skipped -ne 0) { throw "$($suite.skipped) Windows cases were skipped" }
          "All $($suite.tests) Windows cases ran without skips."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-results
          path: ${{ runner.temp }}/akdbx-windows.xml
