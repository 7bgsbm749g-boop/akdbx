[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "akdbx"
version = "0.9.2"
description = "A secret-withholding KeePass autofill broker for local agents"
requires-python = ">=3.11"
dependencies = [
  "pykeepass==4.2.0",
  "python-xlib>=0.33,<1",
]

[project.scripts]
akdbx = "akdbx.cli:main"

[project.urls]
Homepage = "https://github.com/7bgsbm749g-boop/akdbx"
Repository = "https://github.com/7bgsbm749g-boop/akdbx"
Issues = "https://github.com/7bgsbm749g-boop/akdbx/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
