[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "akdbx"
version = "0.35.1"
description = "A secret-withholding KeePass autofill broker for local agents"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "cryptography>=43,<47",
  "idna>=3.7,<4",
  "pykeepass==4.2.0",
  "python-xlib>=0.33,<1; sys_platform == 'linux'",
  "pywin32>=308,<312; sys_platform == 'win32'",
  "websocket-client>=1.8,<2",
]

[project.scripts]
akdbx = "akdbx.cli:main"
akdbx-browser-import = "akdbx.browser_import:main"
akdbx-extension-host = "akdbx.extension_host:main"

[project.urls]
Homepage = "https://github.com/7bgsbm749g-boop/akdbx"
Repository = "https://github.com/7bgsbm749g-boop/akdbx"
Issues = "https://github.com/7bgsbm749g-boop/akdbx/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
akdbx = ["import_assets/*", "browser_extension/*", "fill_extension/*", "public_suffix_assets/*"]

# The agent skill, for `akdbx setup` to link from a wheel install (a checkout links skills/akdbx).
[tool.setuptools.data-files]
"share/akdbx/skills/akdbx" = ["skills/akdbx/SKILL.md"]
"share/akdbx/skills/akdbx/agents" = ["skills/akdbx/agents/*.yaml"]
"share/akdbx/skills/akdbx/references" = ["skills/akdbx/references/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["screenshot_access: build the test extension with the <all_urls> access that Enhanced security asks for",
           "older_build: load the test extension with an older version, in developer mode, to test its self-update"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "cryptography>=43,<47"]
