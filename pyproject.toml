[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "akdbx"
version = "0.21.2"
description = "A secret-withholding KeePass autofill broker for local agents"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<47",
  "idna>=3.7,<4",
  "pykeepass==4.2.0",
  "python-xlib>=0.33,<1; sys_platform == 'linux'",
  "pywin32>=308,<312; sys_platform == 'win32'",
  "websocket-client>=1.8,<2",
]

[project.scripts]
akdbx = "akdbx.cli:main"
akdbx-browser-import = "akdbx.browser_import:main"
akdbx-extension-host = "akdbx.extension_host:main"

[project.urls]
Homepage = "https://github.com/7bgsbm749g-boop/akdbx"
Repository = "https://github.com/7bgsbm749g-boop/akdbx"
Issues = "https://github.com/7bgsbm749g-boop/akdbx/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
akdbx = ["import_assets/*", "browser_extension/*", "fill_extension/*", "public_suffix_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "cryptography>=43,<47"]
