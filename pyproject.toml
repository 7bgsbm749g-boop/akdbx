[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-kdbx"
version = "0.6.0"
description = "A secret-withholding KeePass autofill broker for local agents"
requires-python = ">=3.11"
dependencies = [
  "pykeepass==4.2.0",
  "pynput>=1.7,<2",
]

[project.scripts]
akdbx = "agentic_kdbx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
