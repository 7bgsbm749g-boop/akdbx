<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>akdbx</title><link rel="stylesheet" href="popup.css"></head>
<body>
<h1>akdbx</h1>
<p id="status" role="status">Checking the akdbx broker…</p>
<p id="trust" hidden></p>
<div id="reset" hidden>
  <button id="reset-start" type="button">Reset broker trust…</button>
  <div id="reset-confirm" hidden>
    <p>After a reset, this extension trusts the broker that answers at its next pairing. Pair again only on a
      computer and broker you set up yourself.</p>
    <button id="reset-yes" type="button">Reset and pair again</button>
  </div>
</div>
<div id="pairing" hidden>
  <p>Pair this browser with akdbx. Check that the pairing page shows this code:</p>
  <p id="origin" class="detail"></p>
  <p id="code" class="code"></p>
  <button id="pair" type="button">Open the pairing page</button>
</div>
<button id="unlock" type="button" hidden>Open the unlock page</button>
<p id="unlock-origin" class="detail" hidden></p>
<ul id="entries"></ul>
<p id="version" class="footer"></p>
<script src="config.js"></script>
<script src="trust.js"></script>
<script src="popup.js"></script>
</body>
</html>
